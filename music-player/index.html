<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="icon" href="data:,">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/responsive.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <i class="fa-solid fa-headphones"></i>

            <span>Music Player</span>

        </div>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs or artists...">

            <button id="searchBtn">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- ================= LEFT ================= -->

        <aside class="playlist">

            <div class="playlist-title">

                <h2 id="listTitle">
                    Top Songs
                </h2>

            </div>


            <div id="songList">

                <!-- Songs loaded by JavaScript -->

                <div class="loading">

                    Loading songs...

                </div>

            </div>

        </aside>



        <!-- ================= CENTER ================= -->

        <section class="player">


            <!-- Album Cover -->

            <div class="cover">

                <img
                    id="cover"
                    src="https://placehold.co/500x500?text=Music"
                    alt="Album Cover">

            </div>



            <!-- Song information -->

            <div class="song-info">

                <h2 id="title">
                    No Song Selected
                </h2>

                <p id="artist">
                    Unknown Artist
                </p>

            </div>



            <!-- ================= CONTROLS ================= -->

            <div class="controls">


                <!-- Previous -->

                <button
                    id="prevBtn"
                    title="Previous">

                    <i class="fa-solid fa-backward-step"></i>

                </button>



                <!-- -10 seconds -->

                <button
                    id="back10Btn"
                    title="Back 10 seconds">

                    <i class="fa-solid fa-rotate-left"></i>

                </button>



                <!-- Play -->

                <button
                    id="playBtn"
                    class="play-main"
                    title="Play">

                    <i class="fa-solid fa-play"></i>

                </button>



                <!-- +10 seconds -->

                <button
                    id="forward10Btn"
                    title="Forward 10 seconds">

                    <i class="fa-solid fa-rotate-right"></i>

                </button>



                <!-- Next -->

                <button
                    id="nextBtn"
                    title="Next">

                    <i class="fa-solid fa-forward-step"></i>

                </button>

            </div>



            <!-- ================= PROGRESS ================= -->

            <div class="progress-container">

                <span id="currentTime">
                    0:00
                </span>


                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1">


                <span id="duration">
                    0:00
                </span>

            </div>



            <!-- ================= VOLUME ================= -->

            <div class="volume-container">

                <i
                    id="volumeIcon"
                    class="fa-solid fa-volume-high">
                </i>


                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1">

            </div>



            <!-- ================= LYRICS ================= -->

            <div class="lyrics-section">

                <h2>
                    <i class="fa-solid fa-music"></i>
                    Lyrics
                </h2>


                <div id="lyrics">

                    Select a song to see lyrics.

                </div>

            </div>



            <!-- ================= RELATED ================= -->

            <div class="related-section">

                <h2>

                    <i class="fa-solid fa-user-music"></i>

                    More from this artist

                </h2>


                <div id="relatedSongs">

                    <p>
                        Select a song to see more songs
                        from this artist.
                    </p>

                </div>

            </div>


        </section>


    </main>



    <!-- ================= AUDIO ================= -->

    <audio id="audio"></audio>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            Music Player © 2026
        </p>

    </footer>



<script src="../js/api.js"></script>
<script src="../js/player.js"></script>
<script src="../js/app.js"></script>

</body>

</html>
