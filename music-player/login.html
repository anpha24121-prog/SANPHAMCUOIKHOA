<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Music Player</title>

    <link rel="icon" href="data:,">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/auth.css">

</head>


<body class="auth-page">


    <div class="auth-box">


        <!-- LOGO -->

        <div class="auth-logo">

            <i class="fa-solid fa-headphones"></i>

            <h1>
                Music Player
            </h1>

        </div>


        <!-- TITLE -->

        <h2>
            Welcome Back
        </h2>

        <p class="auth-subtitle">
            Login to continue listening to music.
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <div class="form-group">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>


        <!-- MESSAGE -->

        <p
            id="loginMessage"
            class="auth-message">
        </p>


        <!-- SIGN UP -->

        <p class="auth-link">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>


        <!-- BACK -->

        <a
            href="index.html"
            class="back-home"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Music Player

        </a>

    </div>


    <!-- AUTH JS -->

    <script src="../js/auth.js"></script>


</body>

</html>
