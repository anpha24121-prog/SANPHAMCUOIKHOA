<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="icon" href="data:,">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">


        <!-- LOGO -->

        <div class="logo">

            <i class="fa-solid fa-headphones"></i>

            <span>
                Music Player
            </span>

        </div>



        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs or artists..."
                autocomplete="off"
            >

            <button
                id="searchBtn"
                type="button"
                title="Search"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>



        <!-- AUTH AREA -->

        <div id="authArea">

            <a
                href="login.html"
                class="login-btn"
            >

                <i class="fa-solid fa-user"></i>

                Login

            </a>

        </div>

    </header>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="container">


        <!-- =================================================
             SONG LIST
        ================================================== -->

        <aside class="playlist">


            <div class="playlist-title">

                <h2 id="listTitle">
                    Top Songs
                </h2>

            </div>


            <div
                id="songList"
                class="song-list"
            >

                <div class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading songs...

                </div>

            </div>


        </aside>



        <!-- =================================================
             PLAYER
        ================================================== -->

        <section class="player">


            <!-- ALBUM COVER -->

            <div class="cover">

                <img
                    id="cover"
                    src="https://placehold.co/500x500?text=Music"
                    alt="Album Cover"
                >

            </div>



            <!-- SONG INFO -->

            <div class="song-info">

                <h2 id="title">
                    No Song Selected
                </h2>

                <p id="artist">
                    Unknown Artist
                </p>


                <!-- FAVORITE -->

                <button
                    id="favoriteBtn"
                    class="favorite-btn"
                    type="button"
                >

                    <i class="fa-regular fa-heart"></i>

                    <span>
                        Add to Favorites
                    </span>

                </button>

            </div>



            <!-- =================================================
                 CONTROLS
            ================================================== -->

            <div class="controls">


                <!-- PREVIOUS -->

                <button
                    id="prevBtn"
                    class="control-btn"
                    type="button"
                    title="Previous Song"
                >

                    <i class="fa-solid fa-backward-step"></i>

                </button>



                <!-- BACK 10 -->

                <button
                    id="back10Btn"
                    class="control-btn"
                    type="button"
                    title="Back 10 seconds"
                >

                    <i class="fa-solid fa-rotate-left"></i>

                    <span>10</span>

                </button>



                <!-- PLAY -->

                <button
                    id="playBtn"
                    class="play-btn"
                    type="button"
                    title="Play / Pause"
                >

                    <i class="fa-solid fa-play"></i>

                </button>



                <!-- FORWARD 10 -->

                <button
                    id="forward10Btn"
                    class="control-btn"
                    type="button"
                    title="Forward 10 seconds"
                >

                    <span>10</span>

                    <i class="fa-solid fa-rotate-right"></i>

                </button>



                <!-- NEXT -->

                <button
                    id="nextBtn"
                    class="control-btn"
                    type="button"
                    title="Next Song"
                >

                    <i class="fa-solid fa-forward-step"></i>

                </button>

            </div>



            <!-- =================================================
                 PROGRESS
            ================================================== -->

            <div class="progress-container">

                <span id="currentTime">
                    0:00
                </span>


                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                >


                <span id="duration">
                    0:00
                </span>

            </div>



            <!-- =================================================
                 VOLUME
            ================================================== -->

            <div class="volume-container">

                <i
                    id="volumeIcon"
                    class="fa-solid fa-volume-high"
                ></i>


                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>



            <!-- =================================================
                 LYRICS
            ================================================== -->

            <section class="lyrics-section">

                <h2>

                    <i class="fa-solid fa-music"></i>

                    Lyrics

                </h2>


                <div id="lyricsContent">

                    <p>
                        Lyrics are not available from
                        iTunes API.
                    </p>

                </div>

            </section>



            <!-- =================================================
                 RELATED SONGS
            ================================================== -->

            <section class="related-section">

                <h2>

                    <i class="fa-solid fa-user"></i>

                    More from this artist

                </h2>


                <div id="relatedSongs">

                    <p>
                        Select a song to see
                        more songs from this artist.
                    </p>

                </div>

            </section>


        </section>

    </main>



    <!-- =================================================
         FAVORITE SONGS
    ================================================== -->

    <section class="favorites-section">

        <h2>

            <i class="fa-solid fa-heart"></i>

            My Favorite Songs

        </h2>


        <div id="favoriteSongs">

            <p>
                Login to see your favorite songs.
            </p>

        </div>

    </section>



    <!-- =================================================
         AUDIO
    ================================================== -->

    <audio
        id="audio"
        preload="metadata">
    </audio>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer>

        <p>
            Music Player © 2026
        </p>

    </footer>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>



    <!-- =================================================
         AUTH UI
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const authArea =
                    document.getElementById(
                        "authArea"
                    );


                const user =
                    getCurrentUser();


                if (user) {

                    authArea.innerHTML = `

                        <div class="user-menu">

                            <span class="username">

                                <i class="fa-solid fa-user"></i>

                                ${user.username}

                            </span>


                            <button
                                id="logoutBtn"
                                type="button"
                            >

                                Logout

                            </button>

                        </div>

                    `;


                    document
                        .getElementById("logoutBtn")
                        .addEventListener(
                            "click",
                            function () {

                                logout();

                            }
                        );

                }

            }
        );

    </script>


</body>

</html>
